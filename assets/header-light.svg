<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Yavuzhan Kurşun — Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .name { font: 700 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: -0.5px; }
    .role { font: 500 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; }
    .line { font: 400 14.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
    .chip { font: 500 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1e293b; }
  </style>
  <rect width="1000" height="230" rx="14" fill="url(#bg)" stroke="#e2e8f0"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)" opacity="0.8"/>
  <rect x="0" y="0" width="6" height="230" fill="url(#accent)"/>
  <text x="44" y="78" class="name">Yavuzhan Kurşun</text>
  <text x="44" y="110" class="role">Full-Stack Software Engineer · Java / Spring Boot · React / TypeScript</text>
  <text x="44" y="138" class="line">Multi-tenant SaaS in production · tenant-guard on Maven Central · TÜBİTAK-funded research</text>
  <g transform="translate(44 166)">
    <rect width="54" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="27" y="17" text-anchor="middle" class="chip">Java</text>
    <rect x="62" width="104" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="114" y="17" text-anchor="middle" class="chip">Spring Boot</text>
    <rect x="174" width="64" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="206" y="17" text-anchor="middle" class="chip">React</text>
    <rect x="246" width="98" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="295" y="17" text-anchor="middle" class="chip">TypeScript</text>
    <rect x="352" width="104" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="404" y="17" text-anchor="middle" class="chip">PostgreSQL</text>
    <rect x="464" width="62" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="495" y="17" text-anchor="middle" class="chip">Swift</text>
    <rect x="534" width="70" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="569" y="17" text-anchor="middle" class="chip">Docker</text>
    <rect x="612" width="104" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="664" y="17" text-anchor="middle" class="chip">Claude Code</text>
