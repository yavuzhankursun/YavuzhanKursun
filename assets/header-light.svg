    <circle cx="80" cy="60" r="34" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="80" cy="60" r="16" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="80" cy="60" r="4" fill="#059669"/>
    <circle cx="132" cy="60" r="3" fill="#2563eb"/>
